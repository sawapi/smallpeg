name: Publish

# Publishes the crate to crates.io and/or the npm package, from the commit
# the workflow runs on. Both registries use trusted publishing (OIDC): each
# lists this workflow as a trusted publisher, so no registry token is stored.
#
# npm: the trusted publisher may only stage. The job runs `npm stage
# publish`, and the version goes live when a maintainer approves it with
# 2FA (npmjs.com, Staged Packages; or `npm stage approve <id>`).
#
# The check job tests everything, packs the npm tarball, smoke-tests it and
# records its sha512. Only the publish jobs can request an OIDC token, and
# the npm job publishes exactly the tarball the check job hashed. With
# "Dry run" on (the default), everything runs except the uploads.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true
      crate:
        description: "Publish the crate to crates.io"
        type: boolean
        default: false
      npm:
        description: "Publish the npm package"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Versions agree
        id: version
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          bindings=$(grep -m1 '^version = ' wasm/Cargo.toml | cut -d'"' -f2)
          pkg=$(node -p "require('./npm/package.json').version")
          echo "crate $crate, bindings $bindings, npm $pkg"
          if [ "$crate" != "$bindings" ] || [ "$crate" != "$pkg" ]; then
            echo "versions differ" >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - name: Test the crate
        run: cargo test --release

      - name: Check the crate package
        run: |
          cargo package --list
          cargo publish --dry-run

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$(grep '^wasm-bindgen = ' wasm/Cargo.toml | cut -d'"' -f2 | tr -d '=')" --locked

      - name: Build and test the npm package
        run: |
          (cd npm && npm ci)
          ./npm/build.sh
          (cd npm && npm test)

      # The log lists the files and the sha512 integrity (the value
      # `npm view smallpeg@<version> dist.integrity` reports once published).
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          (cd npm && npm pack --pack-destination "$RUNNER_TEMP/pack")
          tarball=$(ls "$RUNNER_TEMP"/pack/smallpeg-*.tgz)
          tar -tzf "$tarball" | sort
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          echo "$(basename "$tarball") $integrity"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      # Upload before the smoke test, so nothing it installs can alter what
      # gets published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test the tarball
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/smallpeg-*.tgz
          node -e 'const s = require("smallpeg"); const j = s.encode({ data: new Uint8Array(48), width: 4, height: 4 }); if (s.info(j).width !== 4) process.exit(1); console.log("require ok", j.length)'
          node --input-type=module -e 'import { encode, decode } from "smallpeg"; const j = encode({ data: new Uint8Array(64), width: 4, height: 4 }); if (decode(j).width !== 4) process.exit(1); console.log("import ok", j.length)'
          node -e 'const s = require("smallpeg"); const x = require("smallpeg/jxl"); const o = x.toJxl(s.encode({ data: new Uint8Array(192), width: 8, height: 8 })); if (!o.reconstruction || o.data[4] !== 0x4a) process.exit(1); console.log("jxl require ok", o.data.length)'
          node --input-type=module -e 'import { encode } from "smallpeg"; import { toJxl } from "smallpeg/jxl"; import * as web from "smallpeg/jxl/web"; const o = toJxl(encode({ data: new Uint8Array(192), width: 8, height: 8 })); if (!o.reconstruction || typeof web.init !== "function") process.exit(1); console.log("jxl import ok", o.data.length)'
          # The published types resolve for a consumer, for both entry points.
          printf '%s\n' 'import { encode, type Image } from "smallpeg";' 'import { init } from "smallpeg/web";' 'await init();' 'const i: Image = { data: new Uint8Array(3), width: 1, height: 1, channels: 3 };' 'encode(i, { quality: 90 });' > check.mts
          "$GITHUB_WORKSPACE"/npm/node_modules/.bin/tsc --noEmit --strict --module nodenext --target es2022 --lib es2022,dom --types "" check.mts

  publish-crate:
    needs: check
    if: ${{ inputs.crate }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Trusted publishing: exchanges this job's OIDC token for a
      # short-lived crates.io token, revoked when the job ends.
      - name: Authenticate with crates.io
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish smallpeg ${{ needs.check.outputs.version }}
        if: ${{ !inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: cargo publish --dry-run

  publish-npm:
    needs: check
    if: ${{ inputs.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack

      # Publish only the tarball the check job hashed right after packing.
      - name: Find and verify the tarball
        env:
          EXPECTED: ${{ needs.check.outputs.integrity }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/pack/smallpeg-*.tgz)
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          echo "$(basename "$tarball") $actual"
          if [ -z "$EXPECTED" ] || [ "$actual" != "$EXPECTED" ]; then
            echo "integrity does not match the check job's: expected '$EXPECTED'" >&2
            exit 1
          fi
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      # `npm stage` needs npm 11.15 or later.
      - name: Check npm
        run: |
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n' 11.15.0 "$v" | sort -V | head -1)" != 11.15.0 ]; then
            echo "npm $v cannot stage; 11.15.0 or later is required" >&2
            exit 1
          fi

      # Trusted publishing: npm authenticates with this job's OIDC token and
      # attaches provenance on its own. The version waits for approval.
      - name: Stage smallpeg ${{ needs.check.outputs.version }}
        if: ${{ !inputs.dry-run }}
        run: npm stage publish "$TARBALL" --access public
