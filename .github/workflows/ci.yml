name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Clippy (jxl feature)
        run: cargo clippy --release --all-targets --features jxl -- -D warnings
      - name: Tests (jxl feature)
        run: cargo test --release --features jxl
      - name: Clippy (parallel and jxl features)
        run: cargo clippy --release --all-targets --features parallel,jxl -- -D warnings
      - name: Tests (parallel feature)
        run: cargo test --release --features parallel
      - name: Tests (parallel and jxl features)
        run: cargo test --release --features parallel,jxl
      - name: wasm build
        run: cargo build --release --target wasm32-unknown-unknown
      - name: wasm build (jxl feature)
        run: cargo build --release --target wasm32-unknown-unknown --features jxl
      - name: wasm build (parallel feature must fail)
        run: |
          if cargo build --release --target wasm32-unknown-unknown --features parallel 2>/dev/null; then
            echo "expected compile_error for parallel on wasm32" && exit 1
          fi
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs (jxl feature)
        run: cargo doc --no-deps --features jxl
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package check
        run: cargo publish --dry-run --allow-dirty

  npm:
    # The WebAssembly bindings and the npm package built from them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$(grep '^wasm-bindgen = ' wasm/Cargo.toml | cut -d'"' -f2 | tr -d '=')" --locked
      - name: Format
        run: cargo fmt --manifest-path wasm/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path wasm/Cargo.toml --release --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (the jxl module)
        run: cargo clippy --manifest-path wasm/Cargo.toml --release --target wasm32-unknown-unknown --features jxl -- -D warnings
      - name: Install TypeScript
        run: cd npm && npm ci
      - name: Build
        run: ./npm/build.sh
      - name: Test
        run: cd npm && npm test
      - name: Pack
        run: cd npm && npm pack --dry-run

  msrv:
    # rust-version in Cargo.toml is a promise; this keeps it honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build at the declared MSRV
        run: cargo build --release
      - name: Build at the declared MSRV (parallel and jxl features)
        run: cargo build --release --features parallel,jxl
