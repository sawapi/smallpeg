[package]
name = "smallpeg-wasm"
version = "0.17.0"
edition = "2024"
rust-version = "1.88"
description = "JavaScript bindings for smallpeg (the npm package)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Build the module behind `smallpeg/jxl` instead of the main one.
jxl = ["smallpeg/jxl"]

[dependencies]
smallpeg = { path = ".." }
# Pinned: must match the wasm-bindgen CLI that generates the JS glue.
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
